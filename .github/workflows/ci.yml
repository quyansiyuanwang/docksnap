name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Check the changelog generator
        run: |
          python3 -m py_compile scripts/changelog.py
          python3 scripts/changelog_test.py

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test (warnings as errors)
        run: swift test -Xswiftc -warnings-as-errors

      - name: Bundle the app
        run: ./build.sh
